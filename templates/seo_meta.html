<meta name="description" content="{{ seo_description }}">
<link rel="canonical" href="{{ site_url }}{{ seo_path }}">
<meta property="og:type" content="{{ seo_type|default('website') }}">
<meta property="og:site_name" content="fiT-X">
<meta property="og:url" content="{{ site_url }}{{ seo_path }}">
<meta property="og:title" content="{{ seo_title }}">
<meta property="og:description" content="{{ seo_description }}">
<meta property="og:image" content="{{ site_url }}/static/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ seo_title }}">
<meta name="twitter:description" content="{{ seo_description }}">
<meta name="twitter:image" content="{{ site_url }}/static/og-image.png">
