<!DOCTYPE html>
<html lang="en">
<body style="margin:0;padding:0;background:#f4f4f5;">
  <div style="font-family:Arial,Helvetica,sans-serif;max-width:480px;margin:0 auto;padding:24px;background:#ffffff;">
    <p style="color:#888888;font-size:12px;letter-spacing:2px;margin:0 0 8px;">fiT-X REMINDER</p>
    <h1 style="font-size:22px;margin:0 0 12px;color:#111111;">{{ workout_title }}</h1>
    <p style="color:#444444;font-size:15px;margin:0 0 4px;">{{ when_label }} · {{ duration_minutes }} min</p>
    <p style="color:#444444;font-size:15px;margin:0 0 24px;">{{ horizon }}.</p>
    <a href="{{ dashboard_url }}"
       style="background:linear-gradient(135deg,#fef08a,#4ade80);color:#111111;text-decoration:none;padding:12px 24px;border-radius:8px;font-weight:600;">
      Open fiT-X
    </a>
    <p style="color:#aaaaaa;font-size:11px;margin:24px 0 0;">
      You're getting this because email reminders are on for your fiT-X account
      ({{ user_email }}) — you can switch them off in Settings → Integrations.
    </p>
  </div>
</body>
</html>
